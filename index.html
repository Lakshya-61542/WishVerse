<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- =====================================================
         BRAND / BROWSER
    ====================================================== -->

    <title>WishVerse — Moments, made magical</title>

    <meta
      name="description"
      content="WishVerse turns birthdays, anniversaries, proposals and meaningful moments into cinematic interactive surprise websites with photos, music and private reveals."
    />

    <meta
      name="application-name"
      content="WishVerse"
    />

    <meta
      name="theme-color"
      content="#050816"
    />

    <meta
      name="color-scheme"
      content="dark light"
    />

    <!-- =====================================================
         SEARCH ENGINES
    ====================================================== -->

    <meta
      name="robots"
      content="index, follow, max-image-preview:large"
    />

    <meta
      name="googlebot"
      content="index, follow, max-image-preview:large"
    />

    <link
      rel="canonical"
      href="https://wish-verse-nu.vercel.app/"
    />

    <!-- =====================================================
         OPEN GRAPH
         WhatsApp / LinkedIn / Facebook
    ====================================================== -->

    <meta
      property="og:site_name"
      content="WishVerse"
    />

    <meta
      property="og:title"
      content="WishVerse — Moments, made magical"
    />

    <meta
      property="og:description"
      content="Create cinematic surprise websites with memories, music, private reveals and thoughtful personal touches."
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://wish-verse-nu.vercel.app/"
    />

    <meta
      property="og:image"
      content="https://wish-verse-nu.vercel.app/og-cover.png"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <meta
      property="og:image:alt"
      content="WishVerse — Moments, made magical"
    />

    <!-- =====================================================
         TWITTER / X
    ====================================================== -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="WishVerse — Moments, made magical"
    />

    <meta
      name="twitter:description"
      content="Create cinematic surprise websites with photos, music, private reveals and thoughtful personal touches."
    />

    <meta
      name="twitter:image"
      content="https://wish-verse-nu.vercel.app/og-cover.png"
    />

    <!-- =====================================================
         ICONS
    ====================================================== -->

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon.png"
    />

    <!-- =====================================================
         FONTS
    ====================================================== -->

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&family=Caveat:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
